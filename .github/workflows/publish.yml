name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release tag matches project version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          projectVersion="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' build.gradle.kts)"
          if [ "$TAG_NAME" != "v$projectVersion" ]; then
            echo "Release tag '$TAG_NAME' does not match project version 'v$projectVersion' in build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: corretto
          java-version: "21"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Build and test
        run: ./gradlew build

  # This job holds the signing key and the Sonatype credentials, so it must only compile, sign and
  # publish. Tests, formatters and other check tooling belong in the verify job, which has no secrets
  # and runs on a separate runner.
  publish:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: corretto
          java-version: "21"

      # No Gradle cache here: the cache is written by CI runs on main, and this job must not build the
      # release on top of state that other jobs could have changed.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-disabled: true

      - name: Publish to Maven Central
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
