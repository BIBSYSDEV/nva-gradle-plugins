[tasks."publish:latest-release"]
description = "Show the tag of the latest GitHub release"
env = { GH_PAGER = "cat" }
run = "gh release view --json tagName --jq .tagName"

[tasks."publish:local"]
description = "Publish to the local Maven repository as the version in build.gradle.kts plus a -local suffix"
run = "./gradlew publishToMavenLocal -PlocalBuild"

[tasks."publish:release"]
description = "Create a GitHub release for the version on main, which triggers publishing to Maven Central"
confirm = "Create a GitHub release for the version on main and publish it to Maven Central?"
run = '''
version_on_main="$(gh api 'repos/{owner}/{repo}/contents/build.gradle.kts?ref=main' -H 'Accept: application/vnd.github.raw' | sed -n 's/^version = "\(.*\)"$/\1/p')"
if [ -z "$version_on_main" ]; then
  echo "Could not read version from build.gradle.kts on main"
  exit 1
fi
gh release create "v${version_on_main}" --title "v${version_on_main}" --generate-notes --target main
'''
