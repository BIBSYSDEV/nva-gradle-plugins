[versions]
bakdata-mockito = "2.2.0"
dependency-analysis = "3.18.0"
dependency-updates = "0.59.0"
detekt = "1.23.8"
errorprone-plugin = "5.1.0"
junit-bom = "6.1.3"
nexus-publish = "2.0.0"
spectral = "0.2.0-0"
spotless = "8.9.0"

[libraries]
bakdata-mockito-plugin = { module = "com.bakdata.gradle:mockito", version.ref = "bakdata-mockito" }
dependency-updates-plugin = { module = "io.github.ben-manes:gradle-versions-plugin", version.ref = "dependency-updates" }
